#
# This workflow calls the main distribution pipeline from DuckDB to build, test and release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: luajit
      extra_toolchains: python3
      skip_tests: true
      exclude_archs: 'wasm_eh;wasm_mvp;wasm_threads;windows_amd64_mingw;windows_amd64_rtools'

  sqllogictest-linux:
    name: SQLLogicTests (linux_amd64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Checkout Extension CI tools
        uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          path: extension-ci-tools
          ref: v1.5-variegata
          fetch-depth: 1
      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
      - name: Configure (release)
        run: make configure
      - name: Build (release)
        run: make release
        env:
          # gcc, NOT clang: LuaJIT's string hash misbehaves under clang builds
          # (specific-length UDF names resolve to garbage → NULL). Verified:
          # gcc-built LuaJIT handles all lengths; clang-built fails on
          # 13/20/24/32/40-char names. Local = gcc, CI must match.
          CC: ccache gcc
          CXX: ccache g++
      - name: Run SQLLogicTests
        run: make test_release SKIP_TESTS=0

  release:
    name: Create GitHub Release
    needs: duckdb-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Rename release assets with platform suffix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name=$(basename "$artifact_dir")
            platform_suffix="${artifact_name##*-extension-}"
            for asset in "$artifact_dir"/*.duckdb_extension "$artifact_dir"/*.duckdb_extension.wasm; do
              [ -f "$asset" ] || continue
              asset_name=$(basename "$asset")
              if [[ "$asset_name" == *.duckdb_extension.wasm ]]; then
                extension_suffix=".duckdb_extension.wasm"
                stem="${asset_name%.duckdb_extension.wasm}"
              else
                extension_suffix=".duckdb_extension"
                stem="${asset_name%.duckdb_extension}"
              fi
              cp "$asset" "release-assets/${stem}-${platform_suffix}${extension_suffix}"
            done
          done
          test -n "$(find release-assets -type f | head -1)"
          find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
